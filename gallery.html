  <script>
    // Set active link on page load (can be dynamic with backend rendering)
    document.addEventListener('DOMContentLoaded', function() {
      const links = document.querySelectorAll('.nav-link');
      const currentPage = window.location.pathname.split('/').pop(); // Get current page from URL

      links.forEach(link => {
        if (link.getAttribute('href').includes(currentPage)) {
          link.classList.add('underline', 'font-semibold'); // Underline active link
        }
      });

      // Mobile menu toggle
      document.getElementById('mobile-menu-button').addEventListener('click', () => {
        const mobileMenu = document.getElementById('mobile-menu');
        mobileMenu.classList.toggle('hidden');
      });
    });
  </script>
  
  <style>
    /* Active Link Styling */
    .nav-link {
      transition: all 0.3s ease-in-out;
    }

    .nav-link:hover,
    .nav-link:focus,
    .nav-link.underline {
      text-decoration: underline;
      font-weight: 700;
    }

<!-- Modal -->
<div id="imageModal" class="fixed inset-0 bg-black bg-opacity-70 hidden justify-center items-center z-50 px-4">
  <div class="modal-content bg-white p-6 rounded-xl max-w-3xl w-full flex flex-col items-center gap-4 relative">
    <!-- Close Button -->
    <span id="modalClose" class="absolute top-2 right-4 text-gray-500 text-3xl font-bold cursor-pointer">×</span>

    
    <!-- Enlarged Image -->
    <img src="" alt="Enlarged photo" id="modalImg" class="max-w-full max-h-[70vh] object-contain rounded-md shadow-md" />
    
    <!-- Image Description -->
    <p id="modalDesc" class="text-center text-gray-800 text-lg mt-4">Description goes here...</p>
  </div>
</div>











<script>
  document.addEventListener("DOMContentLoaded", () => {
    const modal = document.getElementById("imageModal");
    const modalImg = document.getElementById("modalImg");
    const modalDesc = document.getElementById("modalDesc");
    const modalClose = document.getElementById("modalClose");

    const galleryItems = document.querySelectorAll(".gallery-item");

    galleryItems.forEach(item => {
      item.addEventListener("click", () => {
        modalImg.src = item.src;
        modalDesc.textContent = item.dataset.description || "No description available.";
        modal.classList.remove("hidden");
        modal.classList.add("flex");
      });
    });

    modalClose.addEventListener("click", closeModal);

    modal.addEventListener("click", (e) => {
      if (e.target === modal) {
        closeModal();
      }
    });

    function closeModal() {
      modal.classList.remove("flex");
      modal.classList.add("hidden");
      modalImg.src = "";
      modalDesc.textContent = "";
    }
  });
</script>
